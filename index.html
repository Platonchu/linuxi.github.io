<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк Линуксов - POS Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .terminal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        input, button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            margin: 5px 0;
            font-family: monospace;
            border-radius: 4px;
        }
        button {
            cursor: pointer;
            background: #238636;
            color: white;
            border: none;
        }
        button:hover {
            background: #2ea043;
        }
        #log {
            white-space: pre-wrap;
            background: #010409;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
            height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <h1>Банк Линуксов 🐧💳</h1>

    <div class="terminal">
        <h3>POS Терминал списания</h3>
        <label>Сумма списания:</label><br>
        <input type="number" id="amount-input" placeholder="Например: 500" value="500"><br>
        <button onclick="processWithdrawal()">Списать средства</button>
    </div>

    <div class="terminal">
        <h3>Лог операций</h3>
        <div id="log">Инициализация терминала...\n</div>
    </div>

    <!-- Панель для ввода токена с мобильного устройства (сохраняется в память WebView) -->
    <div id="settings-panel" style="margin-top: 15px; padding: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px;">
        <span style="color: #8b949e; font-size: 12px;">GitHub Token для мобильного терминала:</span><br>
        <input type="password" id="gh-token-input" placeholder="Вставь токен сюда" style="width: 70%;" />
        <button onclick="saveTokenManually()">Сохранить</button>
    </div>

    <script>
        // Твои настройки репозитория (укажи свои данные, если они отличаются)
        const GITHUB_USERNAME = "ТвойЛогинGitHub"; 
        const REPO_NAME    = "ТвоеИмяРепозитория"; 
        const FILE_PATH    = "data.json";

        // Демо-данные счетов (структура под твой бэкенд)
        let cardsData = {
            "balance": 30000,
            "accounts": [
                { "name": "Основной счёт", "amount": 29500 }
            ]
        };

        function logMessage(msg) {
            const logDiv = document.getElementById("log");
            logDiv.innerText += msg + "\n";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Сохранение токена в память телефона (WebView)
        function saveTokenManually() {
            const tokenVal = document.getElementById("gh-token-input").value.trim();
            if (tokenVal) {
                localStorage.setItem("linuxi_github_token", tokenVal);
                alert("Токен успешно сохранен в памяти телефона!");
                document.getElementById("gh-token-input").value = "";
            } else {
                alert("Поле пустое!");
            }
        }

        // Логика списания суммы
        async function processWithdrawal() {
            const amount = parseFloat(document.getElementById("amount-input").value);
            if (isNaN(amount) || amount <= 0) {
                alert("Введи корректную сумму!");
                return;
            }

            logMessage(`Попытка списания: ${amount}...`);

            // Пример изменения данных в объекте (уменьшаем баланс)
            if (cardsData.balance >= amount) {
                cardsData.balance -= amount;
                logMessage(`Баланс обновлен локально. Остаток: ${cardsData.balance}`);
                
                // Отправляем изменения на GitHub
                await saveChangesToGitHub();
            } else {
                logMessage("Ошибка: недостаточно средств!");
                alert("Недостаточно средств!");
            }
        }

        // Функция отправки изменений на GitHub (с защитой от кэша и поддержкой кириллицы)
        async function saveChangesToGitHub() {
            let token = localStorage.getItem("linuxi_github_token");
            
            if (!token) {
                alert("Токен не найден! Введи его в поле настроек внизу страницы.");
                logMessage("Ошибка: токен отсутствует в localStorage.");
                return;
            }

            // Добавляем таймстамп (?t=...), чтобы мобильный WebView не кэшировал старый GET-ответ
            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}?t=${new Date().getTime()}`;

            try {
                logMessage("Получение актуального SHA файла с GitHub...");
                const getRes = await fetch(apiUrl, {
                    headers: { 
                        "Authorization": `token ${token.trim()}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Cache-Control": "no-cache"
                    }
                });

                if (!getRes.ok) {
                    if (getRes.status === 401 || getRes.status === 403) {
                        alert("Ошибка авторизации! Проверь токен и права repo.");
                        logMessage("Ошибка 401/403: Неверный токен.");
                    } else {
                        alert(`Ошибка чтения с GitHub: код ${getRes.status}`);
                        logMessage(`Ошибка чтения: код ${getRes.status}`);
                    }
                    return;
                }

                const fileData = await getRes.json();
                const currentSha = fileData.sha;

                // Кодируем JSON в Base64 с поддержкой кириллицы (для мобилок)
                const jsonString = JSON.stringify(cardsData, null, 2);
                const utf8Bytes = new TextEncoder().encode(jsonString);
                let binaryString = "";
                for (let i = 0; i < utf8Bytes.length; i++) {
                    binaryString += String.fromCharCode(utf8Bytes[i]);
                }
                const encodedContent = btoa(binaryString);

                logMessage("Отправка PUT-запроса на GitHub...");
                const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token.trim()}`,
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({
                        message: "POS Terminal balance update via mobile WebView",
                        content: encodedContent,
                        sha: currentSha
                    })
                });

                if (!putRes.ok) {
                    const errJson = await putRes.json();
                    alert("GitHub отклонил сохранение: " + (errJson.message || "Ошибка"));
                    logMessage("Ошибка GitHub API: " + (errJson.message || "Неизвестная ошибка"));
                } else {
                    logMessage("Успешно сохранено на GitHub!");
                    alert("Списание прошло успешно, данные отправлены!");
                }

            } catch (err) {
                console.error("Сетевая ошибка:", err);
                logMessage("Сетевая ошибка: " + err.message);
                alert("Не удалось отправить данные на GitHub.");
            }
        }
    </script>
</body>
</html>
