<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linuxi Bank</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: monospace;
            background-color: #121212;
            color: #00ff66;
            margin: 0;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 700px;
            margin: 0 auto 20px auto;
        }
        h1 { margin: 0; font-size: 24px; }
        .term-btn {
            background: #2b2b2b;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 8px 14px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            border-radius: 4px;
        }
        .term-btn:hover { background: #00ff66; color: #121212; }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,102,0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #252525; }
        input, button {
            background: #2b2b2b;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            font-family: monospace;
            margin: 5px 0;
            width: 100%;
        }
        button { cursor: pointer; }
        button:hover { background: #00ff66; color: #121212; }
        input { background: #121212; }
        
        /* Модальное окно терминала */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .terminal-box {
            background: #181818;
            border: 2px solid #00ff66;
            width: 90%;
            max-width: 420px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,255,102,0.4);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 10px;
            width: auto;
            padding: 2px 8px;
            background: #333;
            color: #ff5555;
            border: 1px solid #ff5555;
        }
        .card-info {
            background: #0d0d0d;
            border: 1px dashed #00ff66;
            padding: 12px;
            margin: 15px 0;
            border-radius: 4px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-sub { border-color: #ff5555; color: #ff5555; }
        .btn-sub:hover { background: #ff5555; color: #121212; }
    </style>
</head>
<body>

<div class="header-bar">
    <h1>Банк линуксов🐧</h1>
    <button class="term-btn" onclick="openTerminal()">💳 Терминал</button>
</div>

<div class="container">
    <h2>Счета участников</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Владелец</th>
                <th>Баланс</th>
            </tr>
        </thead>
        <tbody id="accounts-table">
            <!-- Подгрузка данных -->
        </tbody>
    </table>
</div>

<!-- Окно банковского POS-терминала -->
<div id="terminal-modal" class="modal-overlay">
    <div class="terminal-box">
        <button class="close-btn" onclick="closeTerminal()">✕</button>
        <h2 style="text-align: center; margin-top: 0;">💳 POS-Терминал</h2>
        
        <label>Введите ID карты:</label>
        <input type="text" id="term-card-id" placeholder="Например: 1 или 2" oninput="searchCard()">
        
        <div id="card-display" class="card-info" style="display:none;">
            <div><b>Владелец:</b> <span id="disp-owner">---</span></div>
            <div><b>Номер:</b> <span id="disp-num">---</span></div>
            <div><b>Баланс:</b> <span id="disp-balance" style="color: #ffff00;">0</span> Линуксов</div>
        </div>

        <div id="transaction-box" style="display:none;">
            <label>Сумма операции:</label>
            <input type="number" id="term-sum" placeholder="Введите сумму">
            <div class="btn-group">
                <button class="btn-sub" onclick="makeTransaction('sub')">Списать (-)</button>
                <button onclick="makeTransaction('add')">Зачислить (+)</button>
            </div>
            <button onclick="saveToGitHub()" style="margin-top: 15px; background: #004411;">💾 Сохранить на GitHub</button>
        </div>
    </div>
</div>

<script>
    const GITHUB_USERNAME = "Platonchu";
    const REPO_NAME = "linuxi.github.io"; 
    const FILE_PATH = "data.json";
    const ADMIN_PASS = "1593";

    let cardsData = [];
    let activeCardIndex = null;

    async function loadData() {
        try {
            const res = await fetch('data.json?' + new Date().getTime());
            cardsData = await res.json();
            renderTable();
        } catch (err) {
            console.error("Ошибка загрузки data.json", err);
            // Защита на случай сбоя сети
            cardsData = [
                { id: "1", owner: "Платон Чукович", balance: 1000 },
                { id: "2", owner: "Рома Сухоносов", balance: 1000 }
            ];
            renderTable();
        }
    }

    function renderTable() {
        const tbody = document.getElementById("accounts-table");
        tbody.innerHTML = "";
        cardsData.forEach((item, index) => {
            const cardId = item.id !== undefined ? item.id : (index + 1);
            const owner = item.owner || item.name || "Неизвестно";
            const balance = item.balance !== undefined ? item.balance : 0;

            tbody.innerHTML += `<tr><td>${cardId}</td><td>${owner}</td><td>${balance}</td></tr>`;
        });
    }

    function openTerminal() {
        const pass = prompt("Введите пароль администратора:");
        if (pass === ADMIN_PASS) {
            document.getElementById("terminal-modal").style.display = "flex";
            document.getElementById("term-card-id").focus();
        } else if (pass !== null) {
            alert("Ах ты негодяй ща по попке дам атата");
        }
    }

    function closeTerminal() {
        document.getElementById("terminal-modal").style.display = "none";
        document.getElementById("term-card-id").value = "";
        searchCard();
    }

    function searchCard() {
        const queryId = document.getElementById("term-card-id").value.trim();
        const displayBox = document.getElementById("card-display");
        const transBox = document.getElementById("transaction-box");

        if (!queryId) {
            displayBox.style.display = "none";
            transBox.style.display = "none";
            activeCardIndex = null;
            return;
        }

        const index = cardsData.findIndex((item, idx) => {
            const currentId = item.id !== undefined ? String(item.id) : String(idx + 1);
            return currentId === queryId;
        });

        if (index !== -1) {
            activeCardIndex = index;
            const card = cardsData[index];
            
            document.getElementById("disp-owner").innerText = card.owner || card.name || "---";
            document.getElementById("disp-num").innerText = card.card_number || "Счет #" + queryId;
            document.getElementById("disp-balance").innerText = card.balance;

            displayBox.style.display = "block";
            transBox.style.display = "block";
        } else {
            displayBox.style.display = "none";
            transBox.style.display = "none";
            activeCardIndex = null;
        }
    }

    function makeTransaction(type) {
        if (activeCardIndex === null) return;
        const sumInput = document.getElementById("term-sum");
        const amount = parseInt(sumInput.value);

        if (isNaN(amount) || amount <= 0) {
            alert("Введите корректную сумму!");
            return;
        }

        if (type === 'sub') {
            cardsData[activeCardIndex].balance -= amount;
        } else {
            cardsData[activeCardIndex].balance += amount;
        }

        sumInput.value = "";
        searchCard();
        renderTable();
        alert("Операция проведена! Нажми 'Сохранить на GitHub'.");
    }

    async function saveToGitHub() {
        let token = localStorage.getItem("linuxi_github_token");
        
        if (!token) {
            token = prompt("Введи твой GitHub Personal Access Token:");
            if (!token) return;
            localStorage.setItem("linuxi_github_token", token);
        }

        try {
            const getFileRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: { "Authorization": `token ${token}` }
            });

            if (!getFileRes.ok) {
                localStorage.removeItem("linuxi_github_token");
                alert("Ошибка доступа! Проверь токен.");
                return;
            }

            const fileData = await getFileRes.json();
            const sha = fileData.sha;

            const jsonString = JSON.stringify(cardsData, null, 2);
            const updatedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "POS Terminal Transaction Update",
                    content: updatedContent,
                    sha: sha
                })
            });

            if (putRes.ok) {
                alert("Успешно зачислено в data.json на GitHub!");
            } else {
                alert("Ошибка записи на GitHub.");
            }
        } catch (err) {
            console.error(err);
            alert("Ошибка соединения.");
        }
    }

    loadData();
</script>

</body>
</html>
