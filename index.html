<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Банк</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: linear-gradient(135deg, #161e31 0%, #111827 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            --success-color: #10b981;
            --danger-color: #ef4444;
            --radius: 16px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-btn-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .admin-btn-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bank-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeIn 0.4s ease forwards;
        }

        .bank-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.4);
            border-color: rgba(56, 189, 248, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
        }

        .card-info h3 {
            margin: 0 0 4px 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .card-number {
            font-family: monospace;
            color: var(--text-secondary);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .card-right {
            text-align: right;
        }

        .balance {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--success-color);
            margin-bottom: 6px;
        }

        .admin-controls {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .action-btn.plus:hover { background: rgba(16, 185, 129, 0.2); border-color: var(--success-color); color: var(--success-color); }
        .action-btn.minus:hover { background: rgba(239, 68, 68, 0.2); border-color: var(--danger-color); color: var(--danger-color); }

        /* Модальное окно админки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #111827;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: scaleIn 0.2s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 { margin-top: 0; margin-bottom: 16px; font-size: 1.2rem; }
        
        .modal input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal input:focus { border-color: var(--accent-color); }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent-gradient);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .admin-panel-active {
            margin-top: 24px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px;
            border-radius: var(--radius);
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .download-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .download-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏛️ Школьный Банк</h1>
            <button class="admin-btn-toggle" id="adminToggleBtn" onclick="openModal()">🔑 Админ</button>
        </header>

        <div id="cards-container" class="card-list">
            <!-- Карточки подгружаются динамически -->
        </div>

        <div id="adminPanelActive" class="admin-panel-active">
            <div>
                <strong style="color: var(--success-color);">Режим админа активен</strong>
                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px;">Измени балансы и скачай новый файл</div>
            </div>
            <button class="download-btn" onclick="exportData()">
                💾 Скачать data.json
            </button>
        </div>
    </div>

    <!-- Модальное окно пароля -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h3>Вход для администратора</h3>
            <input type="password" id="adminPassInput" placeholder="Введите пароль..." onkeydown="if(event.key === 'Enter') login()">
            <p id="passError" style="color: var(--danger-color); font-size: 0.85rem; margin: 0 0 12px 0; display: none;">Неверный пароль!</p>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn-primary" onclick="login()">Войти</button>
            </div>
        </div>
    </div>

    <script>
        let cardsData = [];
        let isAdmin = false;
        const ADMIN_PASS = "admin123"; // Можешь поменять на свой пароль

        async function loadCards() {
            try {
                const res = await fetch('data.json');
                cardsData = await res.json();
                renderCards();
            } catch (err) {
                console.error("Ошибка загрузки данных:", err);
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            cardsData.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'bank-card';
                
                let adminControlsHtml = '';
                if (isAdmin) {
                    adminControlsHtml = `
                        <div class="admin-controls">
                            <button class="action-btn plus" onclick="changeBalance(${index}, 50)">+50</button>
                            <button class="action-btn minus" onclick="changeBalance(${index}, -50)">-50</button>
                        </div>
                    `;
                }

                cardEl.innerHTML = `
                    <div class="card-left">
                        <div class="card-icon">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
                        </div>
                        <div class="card-info">
                            <h3>${card.owner}</h3>
                            <div class="card-number">${card.card_number}</div>
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="balance">${card.balance} BYN</div>
                        ${adminControlsHtml}
                    </div>
                `;
                container.appendChild(cardEl);
            });
        }

        function openModal() {
            if (isAdmin) return;
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('adminPassInput').focus();
        }

        function closeModal() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('adminPassInput').value = '';
            document.getElementById('passError').style.display = 'none';
        }

        function login() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                closeModal();
                document.getElementById('adminToggleBtn').style.display = 'none';
                document.getElementById('adminPanelActive').style.display = 'flex';
                renderCards();
            } else {
                document.getElementById('passError').style.display = 'block';
            }
        }

        function changeBalance(index, amount) {
            cardsData[index].balance += amount;
            renderCards();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cardsData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        loadCards();
    </script>
</body>
</html>
