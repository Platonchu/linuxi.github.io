<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151d">
  <title>Linuxi Bank — игровой банк</title>
  <style>
    :root{color-scheme:dark;--bg:#10151d;--panel:#1a222d;--panel2:#202b38;--line:#344153;--text:#eef4fb;--muted:#a2afbf;--green:#42df91;--red:#ff6b73}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#15372e 0,transparent 36%),linear-gradient(145deg,#0d1219,#121b27);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.hidden{display:none!important}main{width:min(1080px,calc(100% - 28px));margin:32px auto}.auth{min-height:calc(100vh - 64px);display:grid;place-items:center}.card,.panel,header{background:rgba(26,34,45,.92);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 55px #0005}.auth-card{width:min(460px,100%);padding:30px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#174331;font-size:27px}.brand h1{font-size:1.35rem;margin:0}.brand small{color:var(--muted)}h2,h3{letter-spacing:-.03em}h2{margin:0 0 8px}p{color:var(--muted);margin:0 0 22px}.field{margin:16px 0}.field label{display:block;color:#d9e3ed;font-weight:650;font-size:.92rem;margin-bottom:7px}.input{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#111923;color:var(--text);font:inherit;outline:none}.input:focus{border-color:var(--green);box-shadow:0 0 0 3px #42df9125}.buttons,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:#293647;color:var(--text)}button:hover{filter:brightness(1.12)}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--green);color:#082416}.danger{background:#a8323c;color:white}.auth .primary{min-width:120px}.auth p.hint{font-size:.85rem;margin:18px 0 0}.topbar{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.topbar .brand{margin:0}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.sidebar,.maincol{display:grid;align-content:start;gap:16px}.stat,.panel{padding:20px}.label{display:block;color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.07em}.stat strong{font-size:1.8rem;letter-spacing:-.04em}.panel h2{margin-bottom:16px}.panel h3{margin:22px 0 12px}.status{color:var(--muted);font-size:.9rem;min-height:1.3em}.history{display:grid;gap:8px}.history-item,.account-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#111923}.history-item small{color:var(--muted)}.plus{color:var(--green)}.minus{color:#ff979d}.admin-metrics{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.admin-metrics .stat{flex:1;min-width:130px;padding:14px}.admin-metrics strong{font-size:1.4rem}.account-list{display:grid;gap:8px;margin-top:12px}.account-row{flex-wrap:wrap}.account-row small{color:var(--muted)}.empty{color:var(--muted);padding:16px;text-align:center}.toast{position:fixed;right:18px;bottom:18px;max-width:min(420px,calc(100vw - 36px));padding:13px 16px;border:1px solid var(--line);background:#202b38;border-radius:12px;box-shadow:0 10px 30px #0006;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:720px){main{margin:14px auto}.auth{min-height:calc(100vh - 28px)}.auth-card{padding:22px}.layout{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.stat,.panel{padding:16px}}
  </style>
</head>
<body>
  <main>
    <section id="auth-screen" class="auth">
      <form id="auth-form" class="card auth-card">
        <div class="brand"><div class="logo" aria-hidden="true">🐧</div><div><h1>Linuxi Bank</h1><small>Игровой банк</small></div></div>
        <h2>Вход в аккаунт</h2><p>Войди, чтобы открыть свой игровой счет.</p>
        <div class="field"><label for="username">Логин</label><input id="username" class="input" autocomplete="username" required></div>
        <div class="field"><label for="password">Пароль</label><input id="password" class="input" type="password" autocomplete="current-password" required></div>
        <div class="buttons"><button id="login-button" class="primary" type="submit">Войти</button></div>
        <p class="hint">Если вход не удался, проверь логин и пароль в актуальном users.json.</p>
      </form>
    </section>

    <section id="bank-screen" class="hidden">
      <header class="topbar card"><div class="brand"><div class="logo" aria-hidden="true">🐧</div><div><h1>Linuxi Bank</h1><small id="welcome">Игровой банк</small></div></div><button id="logout-button" type="button">Выйти</button></header>
      <div class="layout">
        <aside class="sidebar">
          <div class="card stat"><span class="label">Баланс</span><strong id="balance">0 ЛК</strong></div>
          <div class="card stat"><span class="label">Тип счета</span><strong id="account-type">—</strong></div>
          <div class="card stat"><span class="label">ID счета</span><strong id="account-id">—</strong></div>
        </aside>
        <div class="maincol">
          <section id="player-panel" class="panel hidden">
            <h2>Операции</h2><div id="status" class="status" role="status" aria-live="polite"></div>
            <div class="field"><label for="amount">Сумма</label><input id="amount" class="input" type="number" min="1" step="1" placeholder="Например: 50"></div>
            <div class="buttons"><button id="deposit-button" class="primary" type="button">Пополнить</button><button id="withdraw-button" class="danger" type="button">Списать</button></div>
            <div class="field"><label for="target-id">ID счета получателя</label><input id="target-id" class="input" inputmode="numeric" placeholder="Например: 2"></div>
            <button id="transfer-button" type="button">Перевести</button>
            <h3>Последние операции</h3><div id="player-history" class="history"></div>
          </section>
          <section id="admin-panel" class="panel hidden">
            <h2>Панель администратора</h2><div class="admin-metrics"><div class="card stat"><span class="label">Счетов</span><strong id="admin-count">0</strong></div><div class="card stat"><span class="label">Сумма балансов</span><strong id="admin-balance">0 ЛК</strong></div></div>
            <div class="row"><input id="account-search" class="input" type="search" placeholder="Поиск по ID или владельцу" style="flex:1;min-width:180px"></div>
            <div id="admin-accounts" class="account-list"></div>
          </section>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const CONFIG={owner:"Platonchu",repo:"linuxi.github.io",branch:"main"};
const state={users:[],accounts:[],user:null};
const $=id=>document.getElementById(id);
function toast(message){const node=$("toast");node.textContent=message;node.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove("show"),3500)}
function normalizeUser(user){return{...user,username:String(user.username??user.login??"").trim(),role:String(user.role??"user").toLowerCase(),accountId:Number(user.accountId??0),password:String(user.password??""),passwordHash:String(user.passwordHash??"").toLowerCase(),salt:String(user.salt??"")}}
async function loadFiles(){const root=`https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}`;const [usersResponse,accountsResponse]=await Promise.all([fetch(`${root}/users.json?ts=${Date.now()}`,{cache:"no-store"}),fetch(`${root}/data.json?ts=${Date.now()}`,{cache:"no-store"})]);if(!usersResponse.ok||!accountsResponse.ok)throw new Error("Не удалось загрузить users.json или data.json.");const [users,accounts]=await Promise.all([usersResponse.json(),accountsResponse.json()]);if(!Array.isArray(users)||!Array.isArray(accounts))throw new Error("Формат файла пользователей или счетов неверный.");state.users=users.map(normalizeUser);state.accounts=accounts.map((account,index)=>({...account,id:Number(account.id??index+1),balance:Number(account.balance??0),history:Array.isArray(account.history)?account.history:[]}))}
async function sha256(password,salt){const bytes=new TextEncoder().encode(`${salt}:${password}`);const digest=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,"0")).join("")}
async function checkPassword(user,password){if(user.password!=="")return user.password===password;if(user.passwordHash){const hashed=await sha256(password,user.salt||"linuxi");return hashed===user.passwordHash}return false}
function setSession(user){state.user=user;sessionStorage.setItem("linuxi_user",user.username);const isAdmin=user.role==="admin";$("auth-screen").classList.add("hidden");$("bank-screen").classList.remove("hidden");$("player-panel").classList.toggle("hidden",isAdmin);$("admin-panel").classList.toggle("hidden",!isAdmin);$("welcome").textContent=`${isAdmin?"Администратор":"Игрок"} · ${user.username}`;render()}
function logout(){state.user=null;sessionStorage.removeItem("linuxi_user");$("bank-screen").classList.add("hidden");$("auth-screen").classList.remove("hidden");$("password").value="";$("username").focus()}
function currentAccount(){return state.user&&state.user.role!=="admin"?state.accounts.find(account=>account.id===state.user.accountId):null}
function money(value){return `${Number(value||0).toLocaleString("ru-RU")} ЛК`}
function render(){const account=currentAccount();if(account){$("balance").textContent=money(account.balance);$("account-type").textContent=account.type||"Standard";$("account-id").textContent=`#${account.id}`;$("status").textContent=`Счет владельца ${account.owner||state.user.username}`;const history=$("player-history");history.replaceChildren();[...account.history].reverse().slice(0,8).forEach(item=>{const row=document.createElement("div");row.className="history-item";const note=document.createElement("span");note.textContent=item.note||"Операция";const detail=document.createElement("small");detail.textContent=`${item.time||""} · ${item.type==="add"?"+":"−"}${Number(item.amount||0).toLocaleString("ru-RU")}`;row.append(note,detail);history.append(row)});if(!account.history.length)history.innerHTML='<div class="empty">Операций пока нет.</div>'}if(state.user?.role==="admin"){const list=$("admin-accounts");list.replaceChildren();const query=$("account-search").value.trim().toLocaleLowerCase("ru");const accounts=state.accounts.filter(item=>`${item.id} ${item.owner} ${item.type}`.toLocaleLowerCase("ru").includes(query));$("admin-count").textContent=String(state.accounts.length);$("admin-balance").textContent=money(state.accounts.reduce((sum,item)=>sum+(Number(item.balance)||0),0));if(!accounts.length){list.innerHTML='<div class="empty">Счета не найдены.</div>'}else accounts.forEach(item=>{const row=document.createElement("div");row.className="account-row";const info=document.createElement("span");info.textContent=`#${item.id} · ${item.owner||"Без имени"} · ${item.type||"Standard"}`;const balance=document.createElement("strong");balance.textContent=money(item.balance);row.append(info,balance);list.append(row)})}}
function addHistory(account,type,amount,note){account.history.push({time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),type,amount,note});account.history=account.history.slice(-20)}
function saveLocal(){localStorage.setItem("linuxi_bank_accounts",JSON.stringify(state.accounts));toast("Изменения сохранены в этом браузере.")}
async function login(event){event.preventDefault();const button=$("login-button");button.disabled=true;try{await loadFiles();const name=$("username").value.trim().toLocaleLowerCase("ru");const password=$("password").value;const user=state.users.find(item=>item.username.toLocaleLowerCase("ru")===name);if(!user)throw new Error("Пользователь не найден в users.json.");if(!(await checkPassword(user,password)))throw new Error("Неверный пароль.");if(user.role!=="admin"&&!state.accounts.some(account=>account.id===user.accountId))throw new Error("Счет пользователя не найден в data.json.");const cached=localStorage.getItem("linuxi_bank_accounts");if(cached){try{const localAccounts=JSON.parse(cached);if(Array.isArray(localAccounts))state.accounts=localAccounts.map((account,index)=>({...account,id:Number(account.id??index+1),balance:Number(account.balance??0),history:Array.isArray(account.history)?account.history:[]}))}catch{localStorage.removeItem("linuxi_bank_accounts")}}setSession(user)}catch(error){toast(error.message||"Не удалось войти.")}finally{button.disabled=false}}
async function transact(kind){const account=currentAccount();const amount=Number($("amount").value);if(!account)return;if(!Number.isSafeInteger(amount)||amount<=0){toast("Введи корректную сумму.");return}if(kind==="sub"&&account.balance<amount){toast("Недостаточно средств.");return}account.balance+=kind==="add"?amount:-amount;addHistory(account,kind,amount,kind==="add"?"Пополнение":"Списание");$("amount").value="";saveLocal();render()}
function transfer(){const sender=currentAccount();const targetId=Number($("target-id").value);const amount=Number($("amount").value);const receiver=state.accounts.find(account=>account.id===targetId);if(!sender||!receiver){toast("Счет получателя не найден.");return}if(receiver.id===sender.id){toast("Нельзя перевести самому себе.");return}if(!Number.isSafeInteger(amount)||amount<=0){toast("Введи корректную сумму.");return}if(sender.balance<amount){toast("Недостаточно средств.");return}sender.balance-=amount;receiver.balance+=amount;addHistory(sender,"sub",amount,`Перевод на ID ${receiver.id}`);addHistory(receiver,"add",amount,`Перевод от ID ${sender.id}`);$("amount").value="";$("target-id").value="";saveLocal();render()}
$("auth-form").addEventListener("submit",event=>void login(event));$("logout-button").addEventListener("click",logout);$("deposit-button").addEventListener("click",()=>void transact("add"));$("withdraw-button").addEventListener("click",()=>void transact("sub"));$("transfer-button").addEventListener("click",transfer);$("account-search").addEventListener("input",render);
window.addEventListener("load",async()=>{try{await loadFiles();const saved=sessionStorage.getItem("linuxi_user");if(saved){const user=state.users.find(item=>item.username===saved);if(user){setSession(user);return}}}catch(error){toast(error.message||"Не удалось загрузить данные.")}});
</script>
</body>
</html>
