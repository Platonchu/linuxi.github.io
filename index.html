<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linuxi Bank</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #00ff66;
            margin: 0;
            padding: 20px;
        }
        h1, h2 { text-align: center; }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,102,0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #252525; }
        button, input {
            background: #2b2b2b;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 8px 12px;
            cursor: pointer;
            font-family: monospace;
            margin: 5px 0;
        }
        button:hover { background: #00ff66; color: #121212; }
        input { width: calc(100% - 20px); }
        .admin-panel {
            margin-top: 30px;
            border-top: 1px dashed #00ff66;
            padding-top: 20px;
            display: none;
        }
        /* Терминал */
        #terminal {
            background: #000;
            border: 1px solid #00ff66;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            margin-top: 15px;
            font-size: 14px;
        }
        #term-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #00ff66;
            outline: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🐧 Linuxi Bank</h1>
    <div id="auth-section">
        <button onclick="loginAdmin()">Войти в админку</button>
    </div>

    <h2>Счета участников</h2>
    <table>
        <thead>
            <tr>
                <th>Имя</th>
                <th>Баланс</th>
            </tr>
        <tbody id="accounts-table">
            <!-- Данные подгружаются из data.json -->
        </tbody>
    </table>

    <!-- Админ панель -->
    <div id="admin-panel" class="admin-panel">
        <h2>⚙️ Панель Администратора</h2>
        <button onclick="saveToGitHub()">💾 Сохранить изменения на GitHub</button>
        
        <h3>Добавить/Изменить баланс</h3>
        <input type="text" id="target-user" placeholder="Имя участника">
        <input type="number" id="target-amount" placeholder="Сумма (например: 100 или -50)">
        <button onclick="updateBalance()">Применить</button>

        <h3>💻 Терминал Linuxi</h3>
        <div id="terminal">
            <div>Добро пожаловать в терминал Linuxi Bank. Введи `help` для списка команд.</div>
        </div>
        <input type="text" id="term-input" placeholder="введите команду..." onkeydown="handleTerminal(event)">
    </div>
</div>

<script>
    const GITHUB_USERNAME = "Platonchu";
    const REPO_NAME = "linuxi.github.io"; 
    const FILE_PATH = "data.json";
    const ADMIN_PASS = "1593"; // Твой новый пароль

    let cardsData = [];
    let isAdmin = false;

    // Загрузка данных при старте
    async function loadData() {
        try {
            const res = await fetch('data.json?' + new Date().getTime());
            cardsData = await res.json();
            renderTable();
        } catch (err) {
            console.error("Ошибка загрузки data.json", err);
            // Дефолтные данные на случай отсутствия файла
            cardsData = [
                { name: "Platonchu", balance: 500 },
                { name: "User2", balance: 100 }
            ];
            renderTable();
        }
    }

function renderTable() {
    const tbody = document.getElementById("accounts-table");
    tbody.innerHTML = "";
    cardsData.forEach(item => {
        // Берем поле owner для имени, а баланс из balance
        const userName = item.owner || item.name || "Участник";
        const userBalance = item.balance !== undefined ? item.balance : 0;

        tbody.innerHTML += `<tr><td>${userName}</td><td>${userBalance}</td></tr>`;
    });
}


    function loginAdmin() {
        const pass = prompt("Введите пароль администратора:");
        if (pass === ADMIN_PASS) {
            isAdmin = true;
            document.getElementById("admin-panel").style.display = "block";
            alert("Доступ разрешен!");
            logToTerminal("Успешный вход в систему под правами root.");
        } else {
            alert("Неверный пароль!");
        }
    }

    // Сохранение напрямую на GitHub через токен
    async function saveToGitHub() {
        let token = localStorage.getItem("linuxi_github_token");
        
        if (!token) {
            token = prompt("Введи твой GitHub Personal Access Token (сохранится в браузере):");
            if (!token) return;
            localStorage.setItem("linuxi_github_token", token);
        }

        try {
            logToTerminal("Получение SHA файла с GitHub...");
            const getFileRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: { "Authorization": `token ${token}` }
            });

            if (!getFileRes.ok) {
                localStorage.removeItem("linuxi_github_token");
                alert("Ошибка доступа! Токен недействителен.");
                logToTerminal("Ошибка: неверный токен доступа.");
                return;
            }

            const fileData = await getFileRes.json();
            const sha = fileData.sha;

            const jsonString = JSON.stringify(cardsData, null, 2);
            const updatedContent = btoa(unescape(encodeURIComponent(jsonString)));

            logToTerminal("Отправка коммита...");
            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Обновление балансов через админку Linuxi Bank",
                    content: updatedContent,
                    sha: sha
                })
            });

            if (putRes.ok) {
                alert("Успешно! Изменения улетели на GitHub!");
                logToTerminal("Успех: data.json обновлен на GitHub.");
            } else {
                alert("Ошибка записи.");
                logToTerminal("Ошибка записи в репозиторий.");
            }
        } catch (err) {
            console.error(err);
            alert("Произошла ошибка сети.");
            logToTerminal("Критическая ошибка сети при отправке.");
        }
    }

    function updateBalance() {
        const nameInput = document.getElementById("target-user").value.trim();
        const amount = parseInt(document.getElementById("target-amount").value);

        if (!nameInput || isNaN(amount)) {
            alert("Заполни имя и сумму корректно!");
            return;
        }

        let user = cardsData.find(u => u.name.toLowerCase() === nameInput.toLowerCase());
        if (user) {
            user.balance += amount;
            logToTerminal(`Баланс пользователя ${user.name} изменен на ${amount}. Новый баланс: ${user.balance}`);
        } else {
            cardsData.push({ name: nameInput, balance: amount });
            logToTerminal(`Создан новый пользователь ${nameInput} с балансом ${amount}`);
        }

        renderTable();
        document.getElementById("target-user").value = "";
        document.getElementById("target-amount").value = "";
    }

    // Логика терминала
    function logToTerminal(text) {
        const term = document.getElementById("terminal");
        term.innerHTML += `<div>> ${text}</div>`;
        term.scrollTop = term.scrollHeight;
    }

    function handleTerminal(event) {
        if (event.key === "Enter") {
            const input = document.getElementById("term-input");
            const cmd = input.value.trim();
            logToTerminal(cmd);
            input.value = "";

            const args = cmd.split(" ");
            switch(args[0]) {
                case "help":
                    logToTerminal("Доступные команды:");
                    logToTerminal("  list - показать всех участников");
                    logToTerminal("  save - сохранить изменения на GitHub");
                    logToTerminal("  clear - очистить экран терминала");
                    break;
                case "list":
                    cardsData.forEach(u => logToTerminal(` - ${u.name}: ${u.balance}`));
                    break;
                case "save":
                    saveToGitHub();
                    break;
                case "clear":
                    document.getElementById("terminal").innerHTML = "";
                    break;
                default:
                    logToTerminal(`Команда не найдена: ${args[0]}. Введите 'help'.`);
            }
        }
    }

    loadData();
</script>

</body>
</html>
