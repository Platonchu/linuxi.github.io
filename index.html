<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linuxi Bank</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0a0a;
            color: #00ff66;
            margin: 0;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 20px auto;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; font-size: 26px; text-transform: uppercase; text-shadow: 0 0 8px #00ff66; }
        
        .top-btns { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            background: #151515;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px 18px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,255,102,0.3);
            transition: all 0.2s;
        }
        .btn:hover { background: #00ff66; color: #0a0a0a; box-shadow: 0 0 12px #00ff66; }
        .btn-secondary { background: #151515; color: #aaa; border-color: #444; }
        .btn-secondary:hover { border-color: #00ff66; color: #00ff66; background: transparent; }
        .btn-danger { background: #2a1111; border-color: #ff5555; color: #ff5555; }
        .btn-danger:hover { background: #ff5555; color: #121212; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #121212;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #1a3a2a;
            box-shadow: 0 0 15px rgba(0,255,102,0.1);
        }

        /* Оставили только 2 карточки в статистике (без общего баланса) */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #181818;
            border: 1px solid #224433;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-card div:first-child { color: #888; font-size: 13px; }
        .stat-value { font-size: 22px; font-weight: bold; color: #ffff00; margin-top: 5px; }

        .search-box {
            margin-bottom: 15px;
        }
        input, select {
            background: #0d0d0d;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
            width: 100%;
            outline: none;
        }
        input:focus, select:focus { box-shadow: 0 0 5px #00ff66; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #222;
            padding: 12px;
            text-align: left;
        }
        th { background-color: #1a1a1a; color: #00ff66; }
        tr:nth-child(even) { background-color: #141414; }
        tr:hover { background-color: #1c2b22; }

        /* Значки типов карт */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-standard { color: #aaa; background: #1a1a1a; }
        .badge-vip { color: #ffcc00; background: #2a2200; border: 1px solid #ffcc00; }
        .badge-linux { color: #00ff66; background: #0a2214; border: 1px solid #00ff66; }
        .badge-nextendo { color: #ff3366; background: #2a0f18; border: 1px solid #ff3366; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 10, 5, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-box {
            background: #121212;
            border: 2px solid #00ff66;
            width: 90%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0,255,102,0.3);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .close-btn {
            background: #2a1111;
            color: #ff5555;
            border: 1px solid #ff5555;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-family: monospace;
        }
        .close-btn:hover { background: #ff5555; color: #fff; }

        .card-info {
            background: #080808;
            border: 1px dashed #00ff66;
            padding: 12px;
            margin: 12px 0;
            border-radius: 4px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .preset-btns {
            display: flex;
            gap: 5px;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .preset-btns button {
            padding: 5px 8px;
            font-size: 12px;
            background: #181818;
            border: 1px solid #444;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
        }
        .preset-btns button:hover { border-color: #00ff66; color: #00ff66; background: transparent; }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            background: #050505;
            padding: 8px;
            border: 1px solid #222;
            margin-top: 8px;
            border-radius: 4px;
        }
        .history-item { margin-bottom: 4px; border-bottom: 1px dotted #333; padding-bottom: 2px; }
        .hist-add { color: #00ff66; }
        .hist-sub { color: #ff5555; }

        /* Уведомления */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #00ff66;
            color: #000;
            text-align: center;
            border-radius: 4px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            font-family: monospace;
            box-shadow: 0 0 15px rgba(0,255,102,0.5);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="header-bar">
    <h1>Банк линуксов 🐧</h1>
    <div class="top-btns">
        <button class="btn" onclick="openNewAccountModal()">➕ Открыть счет</button>
        <button class="btn" onclick="openTerminal()">💳 Управление</button>
        <button class="btn btn-secondary" onclick="setupGitHubToken()">🔑 Токен GH</button>
    </div>
</div>

<div class="container">
    <div class="stats-panel">
        <div class="stat-card">
            <div>Всего счетов</div>
            <div id="stat-count" class="stat-value">0</div>
        </div>
        <div class="stat-card">
            <div>Средний баланс</div>
            <div id="stat-avg" class="stat-value">0 ЛК</div>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Поиск по имени или ID..." oninput="renderTable()">
    </div>

    <h2>Счета участников</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Владелец</th>
                <th>Тип карты</th>
                <th>Баланс</th>
            </tr>
        </thead>
        <tbody id="accounts-table"></tbody>
    </table>
</div>

<!-- Окно управления -->
<div id="terminal-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3 style="margin:0; font-size: 18px;">💳 Управление счетом</h3>
            <button class="close-btn" onclick="closeTerminal()">✕</button>
        </div>

        <label style="font-size: 13px; color: #888; margin-bottom: 5px; display: block;">ID или номер карты:</label>
        <input type="text" id="term-card-id" placeholder="Например: 1" oninput="searchCard()">

        <div id="card-display" class="card-info" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div><b>Владелец:</b> <span id="disp-owner">---</span></div>
                <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 11px;" onclick="renameOwner()">✏️</button>
            </div>
            <div style="margin: 10px 0;">
                <label style="font-size: 12px; color: #888;">Тип карты:</label>
                <select id="disp-type-select" onchange="changeCardType()" style="margin-top: 4px;">
                    <option value="Standard">Standard</option>
                    <option value="VIP">VIP 🌟</option>
                    <option value="Linux">Linux 🐧</option>
                    <option value="Nextendo">Nextendo 🌐</option>
                </select>
            </div>
            <div><b>Баланс:</b> <span id="disp-balance" style="color: #ffff00; font-size: 18px;">0</span> ЛК</div>

            <div style="margin-top: 12px;">
                <span style="font-size: 12px; color: #888;">История операций:</span>
                <div id="disp-history" class="history-list"></div>
            </div>
        </div>

        <div id="transaction-box" style="display:none; margin-top: 15px;">
            <label style="font-size: 13px; color: #888; margin-bottom: 5px; display: block;">Сумма операции:</label>
            <input type="number" id="term-sum" placeholder="Введите сумму">
            
            <div class="preset-btns">
                <button onclick="setAmount(10)">+10</button>
                <button onclick="setAmount(50)">+50</button>
                <button onclick="setAmount(100)">+100</button>
                <button onclick="setAmount(500)">+500</button>
                <button onclick="setAmount(1000)">+1000</button>
            </div>

            <div class="btn-group">
                <button class="btn btn-danger" style="flex:1;" onclick="makeTransaction('sub')">Списать (-)</button>
                <button class="btn" style="flex:1;" onclick="makeTransaction('add')">Зачислить (+)</button>
            </div>

            <hr style="border: none; border-top: 1px dashed #224433; margin: 20px 0;">

            <label style="font-size: 13px; color: #888; margin-bottom: 5px; display: block;">Перевод на ID:</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="transfer-target-id" placeholder="ID получателя">
                <button class="btn btn-secondary" onclick="makeTransfer()">Перевести</button>
            </div>

            <button class="btn btn-danger" style="width: 100%; margin-top: 15px;" onclick="deleteAccount()">🗑️ Удалить счет</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const GITHUB_USERNAME = "Platonchu";
    const REPO_NAME = "linuxi.github.io"; 
    const FILE_PATH = "data.json";

    let cardsData = [];
    let activeCardIndex = null;

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
    }

    async function loadData() {
        try {
            const res = await fetch('data.json?' + new Date().getTime());
            cardsData = await res.json();
            renderTable();
        } catch (err) {
            console.error("Ошибка загрузки data.json", err);
            cardsData = [
                { id: "1", owner: "Платон Чукович", type: "Linux", balance: 1000, history: [] },
                { id: "2", owner: "Рома Сухоносов", type: "Standard", balance: 1000, history: [] }
            ];
            renderTable();
        }
    }

    function getBadgeClass(type) {
        switch(type) {
            case 'VIP': return 'badge badge-vip';
            case 'Linux': return 'badge badge-linux';
            case 'Nextendo': return 'badge badge-nextendo';
            default: return 'badge badge-standard';
        }
    }

    function renderTable() {
        const tbody = document.getElementById("accounts-table");
        const filter = document.getElementById("search-input").value.toLowerCase();
        tbody.innerHTML = "";

        let total = 0;

        cardsData.forEach((item, index) => {
            const cardId = item.id !== undefined ? String(item.id) : String(index + 1);
            const owner = item.owner || item.name || "Неизвестно";
            const type = item.type || "Standard";
            const balance = item.balance !== undefined ? item.balance : 0;

            if (owner.toLowerCase().includes(filter) || cardId.includes(filter)) {
                tbody.innerHTML += `
                    <tr>
                        <td>${cardId}</td>
                        <td>${owner}</td>
                        <td><span class="${getBadgeClass(type)}">${type}</span></td>
                        <td style="font-weight: bold; color: #ffff00;">${balance} ЛК</td>
                    </tr>`;
                total += balance;
            }
        });

        document.getElementById("stat-count").innerText = cardsData.length;
        document.getElementById("stat-avg").innerText = cardsData.length ? Math.round(total / cardsData.length) + " ЛК" : "0 ЛК";
    }

    function openTerminal() {
        const pass = prompt("Введите пароль администратора:");
        if (pass === "1593") {
            document.getElementById("terminal-modal").style.display = "flex";
            document.getElementById("term-card-id").focus();
        } else if (pass !== null) {
            alert("Неверный пароль.");
        }
    }

    function closeTerminal() {
        document.getElementById("terminal-modal").style.display = "none";
        document.getElementById("term-card-id").value = "";
        searchCard();
    }

    function searchCard() {
        const queryId = document.getElementById("term-card-id").value.trim();
        const displayBox = document.getElementById("card-display");
        const transBox = document.getElementById("transaction-box");

        if (!queryId) {
            displayBox.style.display = "none";
            transBox.style.display = "none";
            activeCardIndex = null;
            return;
        }

        const index = cardsData.findIndex((item, idx) => {
            const currentId = item.id !== undefined ? String(item.id) : String(idx + 1);
            return currentId === queryId;
        });

        if (index !== -1) {
            activeCardIndex = index;
            const card = cardsData[index];
            
            document.getElementById("disp-owner").innerText = card.owner || card.name || "---";
            document.getElementById("disp-type-select").value = card.type || "Standard";
            document.getElementById("disp-balance").innerText = card.balance;

            const histDiv = document.getElementById("disp-history");
            histDiv.innerHTML = "";
            const history = card.history || [];
            if (history.length === 0) {
                histDiv.innerHTML = "<span style='color:#666;'>Нет операций</span>";
            } else {
                history.slice(-5).reverse().forEach(h => {
                    const cls = h.type === 'add' ? 'hist-add' : 'hist-sub';
                    const sign = h.type === 'add' ? '+' : '-';
                    histDiv.innerHTML += `<div class="history-item ${cls}">${h.time} | ${sign}${h.amount} ЛК (${h.note || 'Операция'})</div>`;
                });
            }

            displayBox.style.display = "block";
            transBox.style.display = "block";
        } else {
            displayBox.style.display = "none";
            transBox.style.display = "none";
            activeCardIndex = null;
        }
    }

    async function changeCardType() {
        if (activeCardIndex === null) return;
        cardsData[activeCardIndex].type = document.getElementById("disp-type-select").value;
        renderTable();
        await saveChangesToGitHub();
    }

    async function renameOwner() {
        if (activeCardIndex === null) return;
        const newName = prompt("Новое имя владельца:", cardsData[activeCardIndex].owner);
        if (newName) {
            cardsData[activeCardIndex].owner = newName;
            searchCard();
            renderTable();
            await saveChangesToGitHub();
        }
    }

    function setAmount(val) {
        document.getElementById("term-sum").value = val;
    }

    function logHistory(card, type, amount, note) {
        if (!card.history) card.history = [];
        const time = new Date().toLocaleTimeString().slice(0, 5);
        card.history.push({ time, type, amount, note });
    }

    async function makeTransaction(type) {
        if (activeCardIndex === null) return;
        const sumInput = document.getElementById("term-sum");
        const amount = parseInt(sumInput.value);

        if (isNaN(amount) || amount <= 0) {
            alert("Введите корректную сумму!");
            return;
        }

        const card = cardsData[activeCardIndex];

        if (type === 'sub') {
            if (card.balance < amount) {
                alert(`Недостаточно средств! Баланс: ${card.balance} ЛК.`);
                return;
            }
            card.balance -= amount;
            logHistory(card, 'sub', amount, 'Списание');
        } else {
            card.balance += amount;
            logHistory(card, 'add', amount, 'Пополнение');
        }

        sumInput.value = "";
        searchCard();
        renderTable();
        await saveChangesToGitHub();
    }

    async function makeTransfer() {
        if (activeCardIndex === null) return;
        const targetId = document.getElementById("transfer-target-id").value.trim();
        const sumInput = document.getElementById("term-sum");
        const amount = parseInt(sumInput.value);

        if (!targetId) { alert("Укажите ID получателя!"); return; }
        if (isNaN(amount) || amount <= 0) { alert("Введите сумму для перевода!"); return; }

        const senderCard = cardsData[activeCardIndex];
        const targetIndex = cardsData.findIndex((item, idx) => (item.id ? String(item.id) : String(idx + 1)) === targetId);

        if (targetIndex === -1) { alert("Получатель не найден!"); return; }
        if (targetIndex === activeCardIndex) { alert("Нельзя перевести самому себе!"); return; }

        const targetCard = cardsData[targetIndex];

        if (senderCard.balance < amount) {
            alert(`Недостаточно средств! Баланс: ${senderCard.balance} ЛК`);
            return;
        }

        senderCard.balance -= amount;
        targetCard.balance += amount;

        logHistory(senderCard, 'sub', amount, `Перевод на ID ${targetId}`);
        logHistory(targetCard, 'add', amount, `Перевод от ID ${senderCard.id}`);

        sumInput.value = "";
        document.getElementById("transfer-target-id").value = "";
        
        searchCard();
        renderTable();
        showToast(`Переведено ${amount} ЛК`);
        await saveChangesToGitHub();
    }

    async function deleteAccount() {
        if (activeCardIndex === null) return;
        const card = cardsData[activeCardIndex];
        if (confirm(`Удалить счет ${card.owner} (ID: ${card.id})?`)) {
            cardsData.splice(activeCardIndex, 1);
            searchCard();
            renderTable();
            showToast("Счет удален");
            await saveChangesToGitHub();
        }
    }

    async function openNewAccountModal() {
        const pass = prompt("Введите пароль администратора:");
        if (pass !== "1593") {
            if (pass !== null) alert("Неверный пароль!");
            return;
        }

        const name = prompt("Введите имя владельца счета:");
        if (!name) return;

        let typeChoice = prompt("Тип карты (1 - Standard, 2 - VIP, 3 - Linux, 4 - Nextendo):", "1");
        let cardType = "Standard";
        if (typeChoice === "2") cardType = "VIP";
        else if (typeChoice === "3") cardType = "Linux";
        else if (typeChoice === "4") cardType = "Nextendo";

        const newId = String(cardsData.length + 1);
        cardsData.push({
            id: newId,
            owner: name,
            type: cardType,
            balance: 100,
            history: [{ time: new Date().toLocaleTimeString().slice(0, 5), type: 'add', amount: 100, note: 'Открытие счета' }]
        });

        renderTable();
        showToast(`Счет ID: ${newId} создан`);
        await saveChangesToGitHub();
    }

    function setupGitHubToken() {
        const currentToken = localStorage.getItem("linuxi_github_token") || "";
        const newToken = prompt("Введи GitHub Personal Access Token:", currentToken);
        if (newToken !== null) {
            if (newToken.trim() === "") {
                localStorage.removeItem("linuxi_github_token");
                showToast("Токен удален");
            } else {
                localStorage.setItem("linuxi_github_token", newToken.trim());
                showToast("Токен сохранен");
            }
        }
    }

    async function saveChangesToGitHub() {
        let token = localStorage.getItem("linuxi_github_token");
        
        if (!token) {
            token = prompt("Введи GitHub Personal Access Token для автосохранения:");
            if (!token) {
                alert("Без токена изменения не сохранятся в репозиторий.");
                return;
            }
            localStorage.setItem("linuxi_github_token", token);
        }

        try {
            const getFileRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: { "Authorization": `token ${token}` }
            });

            if (!getFileRes.ok) {
                localStorage.removeItem("linuxi_github_token");
                alert("Ошибка доступа. Проверь токен.");
                return;
            }

            const fileData = await getFileRes.json();
            const sha = fileData.sha;

            const jsonString = JSON.stringify(cardsData, null, 2);
            const updatedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Bank data automatic update",
                    content: updatedContent,
                    sha: sha
                })
            });

            if (putRes.ok) {
                showToast("Изменения сохранены на GitHub");
            }
        } catch (err) {
            console.error("Ошибка синхронизации:", err);
        }
    }

    loadData();
</script>

</body>
</html>
